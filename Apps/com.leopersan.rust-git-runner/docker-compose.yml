name: rust-git-runner
services:
  app:
    image: leopersan/rust-git-runner:latest
    container_name: rust-git-runner
    restart: unless-stopped
    working_dir: /app
    environment:
      - CARGO_HOME=/cargo
      - GIT_REPOSITORY_URL=
      - GIT_BRANCH=main
      - GITHUB_TOKEN=
      - INSTALL_CMD=cargo fetch
      - BUILD_CMD=cargo build --release
      - START_CMD=
      - APP_PORT=8080
      - PORT=8080
    ports:
      - "8080:8080"
    volumes:
      - rust_git_runner_data:/app

volumes:
  rust_git_runner_data:

x-casaos:
  id: com.leopersan.rust-git-runner
  architectures:
    - amd64
    - arm64
    - arm
  main: app
  description:
    en_us: "Compilação otimizada (`cargo build --release`) e execução de binários web em Rust (Axum, Actix-web, Rocket) com cache de crates Cargo e proxy Cosmos."
    pt_br: "Compilação otimizada (`cargo build --release`) e execução de binários web em Rust (Axum, Actix-web, Rocket) com cache de crates Cargo e proxy Cosmos."
  tagline:
    en_us: "Rust Git Runner Runner"
    pt_br: "Rust Git Runner Runner"
  developer: "Private Market Admin"
  author: "Private Market Admin"
  icon: "https://raw.githubusercontent.com/LeoPersan/cosmos-custom-marketplace/main/Apps/com.leopersan.rust-git-runner/icon.png"
  thumbnail: "https://raw.githubusercontent.com/LeoPersan/cosmos-custom-marketplace/main/Apps/com.leopersan.rust-git-runner/icon.png"
  title:
    en_us: "Rust Git Runner"
    pt_br: "Rust Git Runner"
  category: "Development"
  port_map: "8080"
  index: "/"
