name: golang-git-runner
services:
  app:
    image: leopersan/golang-git-runner:latest
    container_name: golang-git-runner
    restart: unless-stopped
    working_dir: /app
    environment:
      - CGO_ENABLED=0
      - GIT_REPOSITORY_URL=
      - GIT_BRANCH=main
      - GITHUB_TOKEN=
      - INSTALL_CMD=go mod download
      - BUILD_CMD=go build -o /app/bin/server .
      - START_CMD=/app/bin/server
      - APP_PORT=8080
      - PORT=8080
    ports:
      - "8080:8080"
    volumes:
      - golang_git_runner_data:/app

volumes:
  golang_git_runner_data:

x-casaos:
  id: com.leopersan.golang-git-runner
  architectures:
    - amd64
    - arm64
    - arm
  main: app
  description:
    en_us: "Compilação e execução automatizada de microserviços e APIs em Golang 1.24 com cache de módulos e proxy Cosmos."
    pt_br: "Compilação e execução automatizada de microserviços e APIs em Golang 1.24 com cache de módulos e proxy Cosmos."
  tagline:
    en_us: "Golang 1.24 Git Runner Runner"
    pt_br: "Golang 1.24 Git Runner Runner"
  developer: "Private Market Admin"
  author: "Private Market Admin"
  icon: "https://raw.githubusercontent.com/LeoPersan/cosmos-custom-marketplace/main/Apps/com.leopersan.golang-git-runner/icon.png"
  thumbnail: "https://raw.githubusercontent.com/LeoPersan/cosmos-custom-marketplace/main/Apps/com.leopersan.golang-git-runner/icon.png"
  title:
    en_us: "Golang 1.24 Git Runner"
    pt_br: "Golang 1.24 Git Runner"
  category: "Development"
  port_map: "8080"
  index: "/"
