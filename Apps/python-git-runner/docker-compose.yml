name: python-git-runner
services:
  app:
    image: leopersan/python-git-runner:latest
    container_name: python-git-runner
    restart: unless-stopped
    working_dir: /app
    environment:
      - PYTHONUNBUFFERED=1
      - GIT_REPOSITORY_URL=
      - GIT_BRANCH=main
      - GITHUB_TOKEN=
      - INSTALL_CMD=/app/.venv/bin/pip install --no-cache-dir -r requirements.txt
      - BUILD_CMD=
      - START_CMD=/app/.venv/bin/python main.py
      - APP_PORT=8000
      - PORT=8000
    ports:
      - "8000:8000"
    volumes:
      - python_git_runner_data:/app

volumes:
  python_git_runner_data:

x-casaos:
  id: com.leopersan.python-git-runner
  architectures:
    - amd64
    - arm64
    - arm
  main: app
  description:
    en_us: "Deploy automatizado de aplicações Python 3.13 (FastAPI, Flask, Django, Uvicorn, Gunicorn) com ambiente virtual isolado (.venv), clonagem Git segura e integração com proxy Cosmos."
    pt_br: "Deploy automatizado de aplicações Python 3.13 (FastAPI, Flask, Django, Uvicorn, Gunicorn) com ambiente virtual isolado (.venv), clonagem Git segura e integração com proxy Cosmos."
  tagline:
    en_us: "Python 3.13 Git Runner Runner"
    pt_br: "Python 3.13 Git Runner Runner"
  developer: "Private Market Admin"
  author: "Private Market Admin"
  icon: "https://raw.githubusercontent.com/LeoPersan/cosmos-custom-marketplace/main/Apps/com.leopersan.python-git-runner/icon.png"
  thumbnail: "https://raw.githubusercontent.com/LeoPersan/cosmos-custom-marketplace/main/Apps/com.leopersan.python-git-runner/icon.png"
  title:
    en_us: "Python 3.13 Git Runner"
    pt_br: "Python 3.13 Git Runner"
  category: "Development"
  port_map: "8000"
  index: "/"
