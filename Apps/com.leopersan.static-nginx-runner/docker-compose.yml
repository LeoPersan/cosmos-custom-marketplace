name: static-nginx-runner
services:
  app:
    image: nginx:alpine
    container_name: static-nginx-runner
    restart: unless-stopped
    working_dir: /app
    environment:
      - GIT_REPOSITORY_URL=
      - GIT_BRANCH=main
      - GITHUB_TOKEN=
      - DIST_DIR=dist
      - INSTALL_CMD=npm install
      - BUILD_CMD=npm run build
      - APP_PORT=80
      - PORT=80
    ports:
      - "80:80"
    volumes:
      - static_nginx_runner_data:/app
    command: >
      sh -c '
        apk add --no-cache git bash curl nodejs npm >/dev/null 2>&1 || true
        cd /app
        GIT_BRANCH="$${GIT_BRANCH:-main}"
        DIST_DIR="$${DIST_DIR:-dist}"
        
        if [ -n "$$GIT_REPOSITORY_URL" ]; then
          AUTH_REPO_URL="$$GIT_REPOSITORY_URL"
          if [ -n "$$GITHUB_TOKEN" ]; then
            AUTH_REPO_URL=$$(echo "$$GIT_REPOSITORY_URL" | sed -E "s#https://#https://$${GITHUB_TOKEN}@#")
          fi
          if [ ! -d .git ]; then
            echo "[Runner] Clonando repositório estático/SPA: $$GIT_REPOSITORY_URL (branch: $$GIT_BRANCH)..."
            git clone --branch "$$GIT_BRANCH" "$$AUTH_REPO_URL" .
          else
            echo "[Runner] Atualizando repositório estático/SPA (branch: $$GIT_BRANCH)..."
            git remote set-url origin "$$AUTH_REPO_URL"
            git fetch origin "$$GIT_BRANCH"
            git checkout "$$GIT_BRANCH"
            git pull origin "$$GIT_BRANCH"
          fi
        fi
        
        if [ -f package.json ]; then
          INSTALL_CMD="$${INSTALL_CMD:-npm install}"
          BUILD_CMD="$${BUILD_CMD:-npm run build}"
          echo "[Runner] Executando: $$INSTALL_CMD"
          eval "$$INSTALL_CMD"
          echo "[Runner] Executando: $$BUILD_CMD"
          eval "$$BUILD_CMD"
        fi
        
        # Deploy to Nginx web root
        mkdir -p /usr/share/nginx/html
        if [ -d "/app/$$DIST_DIR" ] && [ -n "$$DIST_DIR" ]; then
          echo "[Runner] Copiando arquivos compilados de /app/$$DIST_DIR para /usr/share/nginx/html..."
          rm -rf /usr/share/nginx/html/*
          cp -r /app/$$DIST_DIR/* /usr/share/nginx/html/
        elif [ -f /app/index.html ]; then
          echo "[Runner] Copiando arquivos raiz para /usr/share/nginx/html..."
          rm -rf /usr/share/nginx/html/*
          cp -r /app/* /usr/share/nginx/html/ 2>/dev/null || true
        elif [ ! -f /usr/share/nginx/html/index.html ]; then
          echo '[Runner] Criando página HTML demo...'
          cat << 'EOF' > /usr/share/nginx/html/index.html
        <!DOCTYPE html>
        <html lang="pt-BR">
        <head>
          <meta charset="UTF-8" />
          <meta name="viewport" content="width=device-width, initial-scale=1.0" />
          <title>Static & SPA Nginx ServApp</title>
          <style>
            body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #f8fafc; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
            .card { background: #1e293b; padding: 2.5rem; border-radius: 1rem; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; max-width: 480px; }
            h1 { color: #38bdf8; margin-bottom: 0.5rem; }
            p { color: #94a3b8; line-height: 1.6; }
            .badge { display: inline-block; background: #0284c7; color: white; padding: 0.25rem 0.75rem; border-radius: 9999px; font-weight: bold; font-size: 0.85rem; margin-top: 1rem; }
          </style>
        </head>
        <body>
          <div class="card">
            <h1>Nginx ServApp Online</h1>
            <p>ServApp estático/SPA ativo com sucesso no Cosmos-Server.</p>
            <span class="badge">Cosmos Cloud Ready</span>
          </div>
        </body>
        </html>
        EOF
        fi
        
        cat << 'EOF' > /etc/nginx/conf.d/default.conf
        server {
            listen 80;
            server_name _;
            root /usr/share/nginx/html;
            index index.html index.htm;
            location / {
                try_files $$uri $$uri/ /index.html =404;
            }
        }
        EOF
        
        echo '[Runner] Iniciando Nginx...'
        exec nginx -g 'daemon off;'
      '

volumes:
  static_nginx_runner_data:

x-casaos:
