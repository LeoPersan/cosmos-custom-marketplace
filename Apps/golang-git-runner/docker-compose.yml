name: golang-git-runner
services:
  app:
    image: golang:1.24-alpine
    container_name: golang-git-runner
    restart: unless-stopped
    working_dir: /app
    environment:
      - CGO_ENABLED=0
      - GIT_REPOSITORY_URL=
      - GIT_BRANCH=main
      - GITHUB_TOKEN=
      - INSTALL_CMD=go mod download
      - BUILD_CMD=go build -o /app/bin/server .
      - START_CMD=/app/bin/server
      - APP_PORT=8080
      - PORT=8080
    ports:
      - "8080:8080"
    volumes:
      - golang_git_runner_data:/app
    command: >
      sh -c '
        apk add --no-cache git bash build-base curl >/dev/null 2>&1 || true
        mkdir -p /app/bin
        cd /app
        GIT_BRANCH="$${GIT_BRANCH:-main}"
        START_CMD="$${START_CMD:-/app/bin/server}"
        
        if [ -n "$$GIT_REPOSITORY_URL" ]; then
          AUTH_REPO_URL="$$GIT_REPOSITORY_URL"
          if [ -n "$$GITHUB_TOKEN" ]; then
            AUTH_REPO_URL=$$(echo "$$GIT_REPOSITORY_URL" | sed -E "s#https://#https://$${GITHUB_TOKEN}@#")
          fi
          if [ ! -d .git ]; then
            echo "[Runner] Clonando repositório Go: $$GIT_REPOSITORY_URL (branch: $$GIT_BRANCH)..."
            git clone --branch "$$GIT_BRANCH" "$$AUTH_REPO_URL" .
          else
            echo "[Runner] Atualizando repositório Go (branch: $$GIT_BRANCH)..."
            git remote set-url origin "$$AUTH_REPO_URL"
            git fetch origin "$$GIT_BRANCH"
            git checkout "$$GIT_BRANCH"
            git pull origin "$$GIT_BRANCH"
          fi
        elif [ ! -f main.go ] && [ ! -f go.mod ]; then
          echo '[Runner] Criando aplicação Go demo...'
          cat << 'EOF' > main.go
        package main
        
        import (
        	"encoding/json"
        	"fmt"
        	"net/http"
        	"os"
        )
        
        func main() {
        	port := os.Getenv("APP_PORT")
        	if port == "" {
        		port = "8080"
        	}
        	http.HandleFunc("/", func(w http.ResponseWriter, r *http.Request) {
        		w.Header().Set("Content-Type", "application/json")
        		json.NewEncoder(w).Encode(map[string]string{
        			"status":  "online",
        			"runtime": "Golang 1.24",
        			"message": "ServApp Go ativo no Cosmos-Server",
        		})
        	})
        	fmt.Printf("Servidor Go ouvindo na porta %s\n", port)
        	http.ListenAndServe(":"+port, nil)
        }
        EOF
        fi
        
        if [ -f go.mod ]; then
          INSTALL_CMD="$${INSTALL_CMD:-go mod download}"
          BUILD_CMD="$${BUILD_CMD:-go build -o /app/bin/server .}"
          echo "[Runner] Executando: $$INSTALL_CMD"
          eval "$$INSTALL_CMD"
          echo "[Runner] Executando: $$BUILD_CMD"
          eval "$$BUILD_CMD"
        fi
        
        echo "[Runner] Iniciando binário: $$START_CMD"
        if [ -f /app/bin/server ]; then
          exec /app/bin/server
        elif [ -f main.go ]; then
          exec go run main.go
        else
          exec /bin/sh -c "$$START_CMD"
        fi
      '

volumes:
  golang_git_runner_data:

x-casaos:
  id: com.leopersan.golang-git-runner
  architectures:
    - amd64
    - arm64
    - arm
  main: app
  description:
    en_us: "Compilação e execução automatizada de microserviços e APIs em Golang 1.24 com cache de módulos e proxy Cosmos."
    pt_br: "Compilação e execução automatizada de microserviços e APIs em Golang 1.24 com cache de módulos e proxy Cosmos."
  tagline:
    en_us: "Golang 1.24 Git Runner Runner"
