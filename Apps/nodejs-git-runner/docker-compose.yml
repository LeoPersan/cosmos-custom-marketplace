name: nodejs-git-runner
services:
  app:
    image: leopersan/nodejs-git-runner:latest
    container_name: nodejs-git-runner
    restart: unless-stopped
    working_dir: /app
    environment:
      - NODE_ENV=production
      - GIT_REPOSITORY_URL=
      - GIT_BRANCH=main
      - GITHUB_TOKEN=
      - INSTALL_CMD=npm install
      - BUILD_CMD=
      - START_CMD=npm start
      - APP_PORT=3000
      - PORT=3000
    ports:
      - "3000:3000"
    volumes:
      - nodejs_git_runner_data:/app

volumes:
  nodejs_git_runner_data:

x-casaos:
  id: com.leopersan.nodejs-git-runner
  architectures:
    - amd64
    - arm64
    - arm
  main: app
  description:
    en_us: "Deploy contínuo e execução automatizada de aplicações Node.js 24 / TypeScript / SSR / APIs a partir de repositório Git com persistência em volume e proxy reverso Cosmos."
    pt_br: "Deploy contínuo e execução automatizada de aplicações Node.js 24 / TypeScript / SSR / APIs a partir de repositório Git com persistência em volume e proxy reverso Cosmos."
  tagline:
    en_us: "Node.js 24 Git Runner Runner"
    pt_br: "Node.js 24 Git Runner Runner"
  developer: "Private Market Admin"
  author: "Private Market Admin"
  icon: "https://raw.githubusercontent.com/LeoPersan/cosmos-custom-marketplace/main/Apps/com.leopersan.nodejs-git-runner/icon.png"
  thumbnail: "https://raw.githubusercontent.com/LeoPersan/cosmos-custom-marketplace/main/Apps/com.leopersan.nodejs-git-runner/icon.png"
  title:
    en_us: "Node.js 24 Git Runner"
    pt_br: "Node.js 24 Git Runner"
  category: "Development"
  port_map: "3000"
  index: "/"
