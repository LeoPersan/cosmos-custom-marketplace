name: rust-git-runner
services:
  app:
    image: rust:alpine
    container_name: rust-git-runner
    restart: unless-stopped
    working_dir: /app
    environment:
      - CARGO_HOME=/cargo
      - GIT_REPOSITORY_URL=
      - GIT_BRANCH=main
      - GITHUB_TOKEN=
      - INSTALL_CMD=cargo fetch
      - BUILD_CMD=cargo build --release
      - START_CMD=
      - APP_PORT=8080
      - PORT=8080
    ports:
      - "8080:8080"
    volumes:
      - rust_git_runner_data:/app
    command: >
      sh -c '
        apk add --no-cache git bash curl musl-dev >/dev/null 2>&1 || true
        git config --global --add safe.directory "*" >/dev/null 2>&1 || true
        cd /app
        GIT_BRANCH="$${GIT_BRANCH:-main}"
        
        if [ -n "$$GIT_REPOSITORY_URL" ]; then
          AUTH_REPO_URL="$$GIT_REPOSITORY_URL"
          if [ -n "$$GITHUB_TOKEN" ]; then
            AUTH_REPO_URL=$$(echo "$$GIT_REPOSITORY_URL" | sed -E "s#https://#https://$${GITHUB_TOKEN}@#")
          fi
          if [ ! -d .git ]; then
            echo "[Runner] Clonando repositório Rust: $$GIT_REPOSITORY_URL (branch: $$GIT_BRANCH)..."
            git clone --branch "$$GIT_BRANCH" "$$AUTH_REPO_URL" .
          else
            echo "[Runner] Atualizando repositório Rust (branch: $$GIT_BRANCH)..."
            git remote set-url origin "$$AUTH_REPO_URL"
            git fetch origin "$$GIT_BRANCH"
            git checkout "$$GIT_BRANCH"
            git pull origin "$$GIT_BRANCH"
          fi
        elif [ ! -f Cargo.toml ]; then
          echo '[Runner] Criando aplicação Rust demo...'
          cargo new /tmp/demo --bin >/dev/null 2>&1
          cp -r /tmp/demo/* /app/
          cp /tmp/demo/.gitignore /app/ 2>/dev/null || true
          cat << 'EOF' > /app/src/main.rs
        use std::io::Write;
        use std::net::TcpListener;
        use std::env;
        
        fn main() {
            let port = env::var("APP_PORT").unwrap_or_else(|_| "8080".to_string());
            let addr = format!("0.0.0.0:{}", port);
            let listener = TcpListener::bind(&addr).expect("Falha ao vincular porta");
            println!("Servidor Rust ouvindo em {}", addr);
        
            for stream in listener.incoming() {
                if let Ok(mut stream) = stream {
                    let response_body = r#"{"status":"online","runtime":"Rust Latest","message":"ServApp Rust ativo no Cosmos-Server"}"#;
                    let response = format!(
                        "HTTP/1.1 200 OK\r\nContent-Type: application/json\r\nContent-Length: {}\r\n\r\n{}",
                        response_body.len(),
                        response_body
                    );
                    let _ = stream.write_all(response.as_bytes());
                }
            }
        }
        EOF
        fi
        
        if [ -f Cargo.toml ]; then
          INSTALL_CMD="$${INSTALL_CMD:-cargo fetch}"
          BUILD_CMD="$${BUILD_CMD:-cargo build --release}"
          echo "[Runner] Executando: $$INSTALL_CMD"
          eval "$$INSTALL_CMD"
          echo "[Runner] Executando: $$BUILD_CMD"
          eval "$$BUILD_CMD"
        fi
        
        BIN_TARGET=""
        if [ -n "$$START_CMD" ]; then
          BIN_TARGET="$$START_CMD"
        else
          BIN_NAME=$$(find /app/target/release -maxdepth 1 -type f -executable 2>/dev/null | grep -v 'build' | head -n 1)
          if [ -n "$$BIN_NAME" ]; then
            BIN_TARGET="$$BIN_NAME"
          else
            BIN_TARGET="cargo run --release"
          fi
        fi
        
        echo "[Runner] Iniciando serviço Rust: $$BIN_TARGET"
        exec /bin/sh -c "$$BIN_TARGET"
      '

volumes:
  rust_git_runner_data:

x-casaos:
  id: com.leopersan.rust-git-runner
  architectures:
    - amd64
    - arm64
    - arm
  main: app
  description:
    en_us: "Compilação otimizada (`cargo build --release`) e execução de binários web em Rust (Axum, Actix-web, Rocket) com cache de crates Cargo e proxy Cosmos."
    pt_br: "Compilação otimizada (`cargo build --release`) e execução de binários web em Rust (Axum, Actix-web, Rocket) com cache de crates Cargo e proxy Cosmos."
  tagline:
    en_us: "Rust Git Runner Runner"
    pt_br: "Rust Git Runner Runner"
  developer: "Private Market Admin"
  author: "Private Market Admin"
  icon: "https://raw.githubusercontent.com/LeoPersan/cosmos-custom-marketplace/main/Apps/com.leopersan.rust-git-runner/icon.png"
  thumbnail: "https://raw.githubusercontent.com/LeoPersan/cosmos-custom-marketplace/main/Apps/com.leopersan.rust-git-runner/icon.png"
  title:
    en_us: "Rust Git Runner"
    pt_br: "Rust Git Runner"
  category: "Development"
  port_map: "8080"
  index: "/"
