name: static-nginx-runner
services:
  app:
    image: leopersan/static-nginx-runner:latest
    container_name: static-nginx-runner
    restart: unless-stopped
    working_dir: /app
    environment:
      - GIT_REPOSITORY_URL=
      - GIT_BRANCH=main
      - GITHUB_TOKEN=
      - DIST_DIR=dist
      - INSTALL_CMD=npm install
      - BUILD_CMD=npm run build
      - APP_PORT=80
      - PORT=80
    ports:
      - "80:80"
    volumes:
      - static_nginx_runner_data:/app

volumes:
  static_nginx_runner_data:

x-casaos:
  id: com.leopersan.static-nginx-runner
  architectures:
    - amd64
    - arm64
    - arm
  main: app
  description:
    en_us: "Deploy automatizado de sites estáticos e SPAs (React, Vue, Vite, Svelte, Astro, Angular) com Nginx de alta performance e roteamento SPA integrado."
    pt_br: "Deploy automatizado de sites estáticos e SPAs (React, Vue, Vite, Svelte, Astro, Angular) com Nginx de alta performance e roteamento SPA integrado."
  tagline:
    en_us: "Static & SPA Nginx Runner Runner"
    pt_br: "Static & SPA Nginx Runner Runner"
  developer: "Private Market Admin"
  author: "Private Market Admin"
  icon: "https://raw.githubusercontent.com/LeoPersan/cosmos-custom-marketplace/main/Apps/com.leopersan.static-nginx-runner/icon.png"
  thumbnail: "https://raw.githubusercontent.com/LeoPersan/cosmos-custom-marketplace/main/Apps/com.leopersan.static-nginx-runner/icon.png"
  title:
    en_us: "Static & SPA Nginx Runner"
    pt_br: "Static & SPA Nginx Runner"
  category: "Utilities"
  port_map: "80"
  index: "/"
